name: Universal Site Adapter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read # Secure: No push access required!
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Build site payload (_site/)
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          # Pinned by wheel hash for supply-chain integrity.
          echo "markdown==3.7 --hash=sha256:7eb6df5690b81a1d7942992c97fad2938e956e79df20cbc6186e9c3a77b1c803" > /tmp/reqs.txt
          pip install --require-hashes --only-binary=:all: --no-deps -r /tmp/reqs.txt
          
          python3 - << 'EOF'
          import os, shutil, subprocess, markdown

          os.makedirs("_site", exist_ok=True)
          repo_name = os.environ.get("REPO_NAME", "Site").split("/")[-1]
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()

          # Strict web-asset allowlist (Now updated for Python Indexes and APIs)
          WEB_FILES = {"index.html", "favicon.ico", "robots.txt", "sitemap.xml", "CNAME", "404.html"}
          WEB_DIRS = {"assets", "css", "js", "images", "img", "fonts", "static", "public", "docs", "media", "simple"}
          WEB_EXTS = {".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp", ".ico", ".avif", ".css", ".pdf", ".json", ".whl", ".tar.gz", ".tar.bz2"}

          def is_safe_asset(filepath):
              parts = filepath.split('/')
              ext = os.path.splitext(filepath)[1].lower()
              return (len(parts) == 1 and parts[0] in WEB_FILES) or (parts[0] in WEB_DIRS) or (ext in WEB_EXTS)

          # FIX #1: Sentinel Check Restored to prevent freezing legacy auto-generated repos
          has_custom_site = False
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8", errors="ignore") as f:
                  if "<!-- auto-generated-from-readme -->" not in f.read():
                      has_custom_site = True

          if has_custom_site:
              print("::notice::[CUSTOM SITE] Explicit index.html detected. Packaging strict web assets.")
              for f in tracked:
                  # Never publish CI/CD configs or raw repository metadata
                  if f.startswith(".github/") or f in {".gitignore", "SECURITY.md", "README.md", "LICENSE"}:
                      continue
                  # Publish if it explicitly looks like a web asset or ends in .html
                  if is_safe_asset(f) or f.endswith(".html"):
                      dst = os.path.join("_site", f)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(f, dst)

          else:
              print("::notice::[README FALLBACK] No custom index.html found. Rendering README.md.")
              content = open("README.md", "r", encoding="utf-8").read() if os.path.exists("README.md") else f"# {repo_name}"
              body = markdown.markdown(content, extensions=["tables", "fenced_code", "toc"])
              
              html = f"""<!DOCTYPE html>
              <!-- auto-generated-from-readme -->
              <html><head><meta charset="utf-8"><title>{repo_name}</title>
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
              <style>body {{ box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }}
              @media (max-width: 767px) {{ body {{ padding: 15px; }} }}</style>
              </head><body class="markdown-body">{body}</body></html>"""
              
              with open("_site/index.html", "w", encoding="utf-8") as out:
                  out.write(html)
                  
              # FIX #2: Unified safe copy logic ensures root-level images (like ./logo.png) are copied
              for f in tracked:
                  if f.startswith(".github/") or f in {".gitignore", "SECURITY.md", "README.md", "LICENSE", "index.html"}:
                      continue
                  if is_safe_asset(f):
                      dst = os.path.join("_site", f)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(f, dst)
                      
          # Prevent GitHub Pages from stripping folders starting with underscores
          open("_site/.nojekyll", "w").close()
          EOF

      # FIX #3: Defensive validation restored
      - name: Validate build payload
        run: |
          if [ ! -f "_site/index.html" ]; then
            echo "::error::Build failed to generate _site/index.html"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
